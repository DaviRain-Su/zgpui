name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: brew install glfw wgpu-native freetype harfbuzz

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglfw3-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libx11-dev \
            fonts-dejavu-core \
            pkg-config
          WGPU_VERSION=v29.0.1.1
          curl -fsSL -o /tmp/wgpu.zip \
            "https://github.com/gfx-rs/wgpu-native/releases/download/${WGPU_VERSION}/wgpu-linux-x86_64-release.zip"
          mkdir -p "$HOME/wgpu-native"
          unzip -q /tmp/wgpu.zip -d "$HOME/wgpu-native"
          echo "ZGPUI_PREFIX=$HOME/wgpu-native" >> "$GITHUB_ENV"
          echo "$HOME/wgpu-native/lib" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/wgpu-native/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Test
        run: zig build test --summary all

      - name: Build
        run: zig build

  # Windows: MinGW deps via MSYS2 + wgpu-native GNU zip.
  # translate-c and most of the compile succeed; final link is still blocked on
  # Zig 0.16 + MinGW CRT (`_setjmp` / `use_lld=false` emit bugs). See docs/WINDOWS.md.
  windows-smoke:
    name: windows smoke (experimental)
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-graphite2
            mingw-w64-x86_64-pkgconf
            unzip
            curl

      - name: Install wgpu-native (Windows GNU)
        shell: bash
        run: |
          set -euo pipefail
          WGPU_VERSION=v29.0.1.1
          # Convert Git-Bash $HOME to a Windows path Zig can consume.
          PREFIX="$(cygpath -m "$HOME/wgpu-native")"
          MINGW_PREFIX="$(cygpath -m "${{ steps.msys2.outputs.msys2-location }}/mingw64")"
          curl -fsSL -o /tmp/wgpu.zip \
            "https://github.com/gfx-rs/wgpu-native/releases/download/${WGPU_VERSION}/wgpu-windows-x86_64-gnu-release.zip"
          rm -rf "$HOME/wgpu-native"
          mkdir -p "$HOME/wgpu-native"
          unzip -q /tmp/wgpu.zip -d "$HOME/wgpu-native"
          if [ ! -d "$HOME/wgpu-native/include" ]; then
            nested="$(find "$HOME/wgpu-native" -mindepth 1 -maxdepth 1 -type d | head -1)"
            if [ -n "$nested" ] && [ -d "$nested/include" ]; then
              shopt -s dotglob
              mv "$nested"/* "$HOME/wgpu-native"/
              rmdir "$nested" 2>/dev/null || true
            fi
          fi
          test -f "$MINGW_PREFIX/include/GLFW/glfw3.h"
          test -f "$MINGW_PREFIX/include/freetype2/ft2build.h"
          test -f "$MINGW_PREFIX/include/harfbuzz/hb.h"
          test -d "$HOME/wgpu-native/include"
          echo "ZGPUI_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "MSYSTEM_PREFIX=$MINGW_PREFIX" >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          echo "$PREFIX/lib" >> "$GITHUB_PATH"
          echo "$MINGW_PREFIX/bin" >> "$GITHUB_PATH"
          echo "Using ZGPUI_PREFIX=$PREFIX"
          echo "Using MSYSTEM_PREFIX=$MINGW_PREFIX"
          ls -la "$HOME/wgpu-native/include" || true
          ls -la "$HOME/wgpu-native/lib" || true
          ls -la "$MINGW_PREFIX/include/GLFW" || true
          ls -la "$MINGW_PREFIX/lib"/libfreetype* "$MINGW_PREFIX/lib"/libharfbuzz* "$MINGW_PREFIX/lib"/libglfw* 2>/dev/null || true
          ls -la "$MINGW_PREFIX/bin"/libfreetype*.dll "$MINGW_PREFIX/bin"/libharfbuzz*.dll "$MINGW_PREFIX/bin"/glfw*.dll 2>/dev/null || true

      - name: Test
        shell: bash
        run: zig build test -Dtarget=x86_64-windows-gnu --summary all

      - name: Build
        shell: bash
        run: zig build -Dtarget=x86_64-windows-gnu
