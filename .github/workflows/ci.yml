name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: brew install glfw wgpu-native freetype harfbuzz

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglfw3-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libx11-dev \
            fonts-dejavu-core \
            pkg-config
          WGPU_VERSION=v29.0.1.1
          curl -fsSL -o /tmp/wgpu.zip \
            "https://github.com/gfx-rs/wgpu-native/releases/download/${WGPU_VERSION}/wgpu-linux-x86_64-release.zip"
          mkdir -p "$HOME/wgpu-native"
          unzip -q /tmp/wgpu.zip -d "$HOME/wgpu-native"
          echo "ZGPUI_PREFIX=$HOME/wgpu-native" >> "$GITHUB_ENV"
          echo "$HOME/wgpu-native/lib" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/wgpu-native/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Test
        run: zig build test --summary all

      - name: Build
        run: zig build

  # Windows: MinGW deps via MSYS2 + wgpu-native GNU zip (compile + unit tests).
  windows-smoke:
    name: windows smoke
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-pkgconf
            unzip
            curl

      - name: Install wgpu-native (Windows GNU)
        shell: bash
        run: |
          set -euo pipefail
          WGPU_VERSION=v29.0.1.1
          PREFIX="$HOME/wgpu-native"
          curl -fsSL -o /tmp/wgpu.zip \
            "https://github.com/gfx-rs/wgpu-native/releases/download/${WGPU_VERSION}/wgpu-windows-x86_64-gnu-release.zip"
          rm -rf "$PREFIX"
          mkdir -p "$PREFIX"
          unzip -q /tmp/wgpu.zip -d "$PREFIX"
          if [ ! -d "$PREFIX/include" ]; then
            nested="$(find "$PREFIX" -mindepth 1 -maxdepth 1 -type d | head -1)"
            if [ -n "$nested" ] && [ -d "$nested/include" ]; then
              shopt -s dotglob
              mv "$nested"/* "$PREFIX"/
              rmdir "$nested" 2>/dev/null || true
            fi
          fi
          echo "ZGPUI_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          # Native Zig on Windows needs a Windows-style MinGW root.
          echo "MSYSTEM_PREFIX=C:/msys64/mingw64" >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"
          ls -la "$PREFIX"
          ls -la "$PREFIX/include" || true
          ls -la "$PREFIX/lib" || true

      - name: Test
        shell: bash
        run: zig build test --summary all

      - name: Build
        shell: bash
        run: zig build
